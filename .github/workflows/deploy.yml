name: deploy

# main 에 push 되면 소형 인스턴스로 배포(rsync → docker compose up --build).
# 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod      # 동시 배포 방지(이전 실행 취소)
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: secrets.toml 생성(구글 OIDC — git 미포함)
        run: |
          mkdir -p .streamlit
          printf '%s\n' "${{ secrets.STREAMLIT_SECRETS_TOML }}" > .streamlit/secrets.toml

      - name: 인스턴스로 코드 전송(rsync)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' --exclude='.venv/' --exclude='__pycache__/' \
            --exclude='*.pyc' --exclude='.env' \
            --exclude='reports/' --exclude='workspaces/' --exclude='outputs/' \
            --exclude='notebooks/' --exclude='data/' \
            --exclude='AI_Lecture_Analysis_Report_Generator/' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/core/"

      - name: 빌드 & 기동
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/core && docker compose -f deploy/docker-compose.yml up -d --build && \
             docker compose -f deploy/docker-compose.yml ps'

      - name: 헬스 체크
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 \
                   https://lectureAnalzer.yeseulkim.cloud/_stcore/health || true)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::헬스 200 미확인(첫 배포 TLS 발급 지연일 수 있음)"
