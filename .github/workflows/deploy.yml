name: deploy

# 브랜치별 배포 — 각 브랜치가 자기 GitHub Environment(같은 이름)의 secret 을 써서
# 서로 다른 인스턴스·도메인으로 배포된다.
#   - main        → Environment "main"        (예슬 prod)
#   - deploy/<이름> → Environment "deploy/<이름>" (팀원별 포폴 인스턴스)
# 새 팀원 추가: (1) 인스턴스 준비 → (2) deploy/<이름> 브랜치 생성 →
#   (3) 같은 이름 Environment 만들고 아래 secret/변수 등록 → (4) 그 브랜치에 push.
# 수동 실행도 가능(Actions 탭 → Run workflow → 브랜치 선택).
on:
  push:
    branches:
      - main
      - "deploy/**"
  workflow_dispatch:

concurrency:
  # 같은 브랜치(=인스턴스)끼리만 동시배포 방지. 브랜치가 다르면 병렬 배포 OK.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 브랜치와 같은 이름의 Environment 를 선택 → 그 Environment 의 secret/변수가 주입된다.
    # (Environment 보호규칙의 "deployment branches" 로 브랜치↔환경을 1:1 고정하면
    #  남의 push 가 내 인스턴스·secret 을 못 건드림)
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH 키 설정
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: secrets.toml 생성(구글 OIDC — git 미포함)
        # ⚠️ Secret 을 셸 명령에 직접 보간하면 TOML 안의 " 가 따옴표를 깨뜨림.
        #    반드시 env 로 받아 변수로 써야 따옴표·줄바꿈이 보존된다.
        env:
          SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          printf '%s\n' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: 인스턴스로 코드 전송(rsync)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' --exclude='.venv/' --exclude='__pycache__/' \
            --exclude='*.pyc' --exclude='.env' \
            --exclude='reports/' --exclude='workspaces/' --exclude='outputs/' \
            --exclude='notebooks/' --exclude='data/' \
            --exclude='AI_Lecture_Analysis_Report_Generator/' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/core/"

      - name: 도메인 .env 생성(원격 — compose/Caddy 치환용)
        # rsync 는 .env 를 제외하므로 원격에서 직접 생성. DEPLOY_DOMAIN 은 Environment 변수.
        # (도메인은 DNS 로 공개되는 값이라 secret 아닌 variable 로 둔다)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p ~/core && printf 'DOMAIN=%s\n' '${{ vars.DEPLOY_DOMAIN }}' > ~/core/.env"

      - name: 빌드 & 기동 & 정리
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e; cd ~/core
             # 빌드(requirements 안 바뀌면 pip 레이어 캐시 재사용 → 빠름) & 기동.
             # --env-file .env 로 DOMAIN 주입(compose 변수 치환 + caddy 환경변수).
             # 볼륨(lecture-data·caddy-data)은 그대로 → 사용자 보고서·인증서 유지.
             docker-compose --env-file .env -f deploy/docker-compose.yml up -d --build
             docker-compose --env-file .env -f deploy/docker-compose.yml ps
             # 쓰레기 정리: 떨어져나간 옛 이미지(dangling)만 삭제. 볼륨·사용중 이미지·빌드캐시는 보존.
             docker image prune -f || true
             # 빌드캐시는 살리되 3GB 초과분만 정리(디스크 폭주 방지, 다음 빌드 속도 유지).
             docker builder prune -f --keep-storage=3GB || true
             echo "--- 디스크 사용량 ---"; df -h / | tail -1'

      - name: 헬스 체크
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 \
                   "https://${{ vars.DEPLOY_DOMAIN }}/_stcore/health" || true)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::헬스 200 미확인(첫 배포 TLS 발급 지연일 수 있음)"
