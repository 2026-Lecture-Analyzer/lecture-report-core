# 소형 인스턴스 1대 배포 — app(Streamlit) + caddy(TLS·도메인).
# 사용: cd core && docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..            # core/ 를 빌드 컨텍스트로(.dockerignore 적용)
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      LECTURE_DATA_DIR: /data/workspaces
      LECTURE_QUOTA_MB: "200"
    volumes:
      - lecture-data:/data                       # 워크스페이스 보고서 영속
      - ../.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro  # 구글 OIDC
    expose:
      - "8503"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  lecture-data:
  caddy-data:
  caddy-config:
